name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, gd, mbstring, fileinfo
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint PHP
        run: for f in app/*.php views/*.php views/admin/*.php scripts/*.php; do php -l "$f" || exit 1; done
      - name: Check JavaScript syntax
        run: node --check public/assets/app.js
      - name: Integration tests
        run: python3 tests/integration.py
